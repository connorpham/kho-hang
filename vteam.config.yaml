# vteam configuration — the contract between this repo and the framework.
# Schema house of record: the vteam package's docs/DESIGN.md §2.
version: 1

project:
  name: 'StockFlow WMS'
  key: WMS
  language: vi
  adopted: 2026-08-19
  # 🟡 MỐC TẠM (Q1, 2026-08-19) — chưa phải cam kết với khách hàng.
  # Số học: nền (schema 34 thực thể + migration thủ công + auth/RBAC) ~15 pd
  # + 20 màn hình × ~1.5 pd = ~45 pd; ÷ capacity_per_day 0.8 = 56 ngày làm
  # việc → 2026-11-05; cộng đệm 20% → 2026-11-24. Mọi ước lượng ở đây là
  # PHỎNG ĐOÁN cho tới khi BA có backlog thật — thay ngày này ngay khi có.
  go_live: 2026-11-24

paths:
  specs: docs/specs
  pm: docs/pm
  qa: docs/qa
  adr: docs/adr
  team: docs/team
  design: docs/design
  evidence: evd
  backlog: docs/backlog

specs:
  # the ORIGINAL spec documents BA shards from (verbatim_gate compares shards
  # in paths.specs against these — leave empty until you have source docs;
  # never point it at paths.specs itself: self-comparison is self-grading)
  # CÒN TRỐNG — gate `verbatim` đang KHÔNG canh gì cả (nó cảnh báo to rồi pass).
  # Lý do: verbatim_gate đọc source bằng read_text(utf-8) và so khớp regex
  #   ^\| \*\*<MÃ>\*\* \|
  # nên source phải là markdown/plain text có bảng yêu cầu — .docx và .pdf trong
  # docs/ KHÔNG dùng trực tiếp được.
  # VIỆC ĐẦU TIÊN CỦA BA: chuyển SRS/SRD sang markdown tại docs/specs/sources/
  # (giữ nguyên verbatim từng dòng yêu cầu), rồi liệt kê ở đây:
  #   sources: [docs/specs/sources/SRS.md, docs/specs/sources/SRD.md]
  sources: []

docs:
  task_context:            # extra background /dev reads at T1, keyed by ticket label/type
    always:                # đọc cho MỌI ticket
      - docs/adr/0001-stack-nextjs-prisma-postgres.md
    by_label: {}           # label/type (lowercase) -> file list; a mapped-but-missing
                           # file is reported LOUDLY in the task sheet, never guessed

stack:
  profile: nextjs-prisma
  package_manager: npm

git:
  # develop là nhánh tích hợp: mọi PR merge vào đây. main là nhánh phát hành.
  # LƯU Ý: hook pre-push chỉ bảo vệ ĐƯỢC MỘT nhánh — nhánh khai báo ở đây. main
  # phải được bảo vệ bằng branch protection trên GitHub, hook không canh nó.
  protected_branch: develop
  branch_pattern: "^(feat|fix)/{key}-[0-9]+-"
  merge_strategy: merge
  # merge | squash | rebase — how PRs land on the protected branch. squash and
  # rebase DISCARD branch shas, so QA verdicts anchor by VERIFIED-AT (qa workflow)
  # and stale_verdict_check falls back to it; set this to match your repo.
  hooks: managed
  # Derived from THIS repo's layout at init time (field-trial finding #17: a
  # hardcoded [src/, prisma/] default silently lost the review fence on repos
  # whose code lives in lib/, app/ or root files). Review it — the review fence
  # and stale-verdict gate only watch what is listed here. An empty list means
  # derivation found nothing: doctor warns, and the pre-push fence FAILS CLOSED
  # (every path is treated as product code) until you fill it in.
  code_paths: [src/, prisma/]

tracker:
  provider: jira
  done_statuses: [Done, Closed, Resolved]
  review_status: In Review

design:
  provider: none

team:
  size: 1
  capacity_per_day: 0.8

autonomy:
  # Nâng lên full ngày 2026-08-19 theo yêu cầu chủ dự án, sau 5 phiên mà mọi việc
  # đều dừng ở hàng đợi. Ở mức này: câu đến hạn được máy quyết TẠM (🟡
  # pending-acceptance, có lý do, đảo ngược được), QA tự đóng ticket đã pass,
  # draft BA được challenger duyệt thì tự thành ticket.
  level: full
  # Bật cùng lúc: PR xanh tự merge vào develop. Đây là cửa cuối cùng rời khỏi tay
  # người, nên hai thứ dưới đây là phanh duy nhất còn lại: gate phải xanh, và
  # exemptions phải không dính.
  self_merge: true
  exemptions:
    - real-money
    - legal
    - purchasing
    - credentials
    - data-deletion

review:
  reviewers: 2
  # Đường dẫn mà một lỗi review là không thể sửa êm: schema/migration chạm dữ
  # liệu tồn kho thật, ton-kho.ts là house of record của BRULE-11 (SRD §7 yêu
  # cầu "áp dụng nhất quán ở mọi màn hình và mọi API"), gates.yaml thực thi
  # shell command từ repo root nên write access = execute access.
  high_stakes_paths:
    - prisma/schema.prisma
    - prisma/migrations/
    - src/lib/ton-kho.ts
    - .vteam/profiles/
    - vteam.config.yaml
    - .github/workflows/
  # Từ vựng nghiệp vụ mang nghĩa mất tiền hoặc không thể hoàn tác.
  high_stakes_terms:
    - dieu chinh
    - điều chỉnh
    - kiem ke
    - kiểm kê
    - huy phieu
    - hủy phiếu
    - dao nguoc
    - đảo ngược
    - phan bo
    - phân bổ
    - chuyen dong kho
    - chuyển động kho
    - ton kha dung
    - tồn khả dụng
    - GRANT
    - REVOKE
    - migrate deploy

models:
  routing: default
